name: Sync from AlphaX source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-source
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge source updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add source https://github.com/AlphaX-SAAS/neo_connect.git
          git fetch source main
          git merge source/main --no-edit --allow-unrelated-histories
          git push origin HEAD:main
